function wireGraphCard(g) {
  const card = document.querySelector(`.graph-card[data-id="${g.id}"]`);
  if (!card) return;
  const canvas = card.querySelector('canvas.chart');
  const redraw = () => { drawGraph(g, canvas); if (expandedGraphId === g.id) redrawGraphModal(); };
  card.querySelectorAll('[data-preset]').forEach((b) => {
    b.addEventListener('click', () => {
      g.xKey = 't'; g.yKey = b.dataset.preset; g.roiMin = null; g.roiMax = null;
      renderGraphsPanel();
    });
  });
  const trackSel = card.querySelector('.trackSel');
  if (trackSel) trackSel.addEventListener('change', (e) => { g.trackId = e.target.value; g.roiMin = null; g.roiMax = null; renderGraphsPanel(); });
  card.querySelector('.xSel').addEventListener('change', (e) => { g.xKey = e.target.value; redraw(); });
  card.querySelector('.ySel').addEventListener('change', (e) => { g.yKey = e.target.value; redraw(); });
  card.querySelector('.fitSel').addEventListener('change', (e) => { g.fit = e.target.value; card.querySelector('.seedWrap').style.display = g.fit === 'sinusoidal' ? '' : 'none'; redraw(); });
  const seedInp = card.querySelector('.seedFreq');
  if (seedInp) seedInp.addEventListener('input', (e) => { g.seedFreq = parseFloat(e.target.value) || 1; redraw(); });
  card.querySelector('.roiMin').addEventListener('input', (e) => { g.roiMin = e.target.value === '' ? null : Number(e.target.value); redraw(); });
  card.querySelector('.roiMax').addEventListener('input', (e) => { g.roiMax = e.target.value === '' ? null : Number(e.target.value); redraw(); });
  card.querySelector('[data-action="clearRoi"]').addEventListener('click', () => { g.roiMin = null; g.roiMax = null; renderGraphsPanel(); });
  card.querySelector('[data-action="remove"]').addEventListener('click', () => removeGraph(g.id));
  card.querySelector('[data-action="expand"]').addEventListener('click', () => openGraphModal(g.id));
  card.querySelector('[data-action="savePng"]').addEventListener('click', () => exportGraphImage(canvas, g));
  // Drag directly across the chart to select a stretch — the readout below
  // updates live as you drag, then locks in on release. A plain tap (no
  // movement) clears the current selection rather than picking a
  // zero-width one-frame range.
  canvas.addEventListener('pointerdown', (evt) => {
    const rect = canvas.getBoundingClientRect();
    const startFrame = nearestFrameForPixelX(g, canvas, evt.clientX - rect.left);
    if (startFrame === null) return;
    canvas.setPointerCapture(evt.pointerId);
    let moved = false;
    g.roiMin = startFrame; g.roiMax = startFrame;
    redraw();
    const onMove = (mv) => {
      moved = true;
      const f = nearestFrameForPixelX(g, canvas, mv.clientX - rect.left);
      if (f !== null) { g.roiMax = f; redraw(); }
    };
    const onUp = () => {
      canvas.removeEventListener('pointermove', onMove);
      canvas.removeEventListener('pointerup', onUp);
      canvas.removeEventListener('pointercancel', onUp);
      if (!moved) { g.roiMin = null; g.roiMax = null; redraw(); }
    };
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  });
  fitCanvasCard(canvas);
  drawGraph(g, canvas);
}

function fitCanvasCard(canvas) {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  canvas.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
}

function graphSeries(g) {
  const track = state.tracks.find((t) => t.id === g.trackId);
  if (!track) return null;
  const series = computeTrackSeries(track);
  const xs = series[g.xKey], ys = series[g.yKey];
  const pts = series.frames.map((f, i) => ({ frame: f, x: xs[i], y: ys[i] }))
    .filter((p) => Number.isFinite(p.x) && Number.isFinite(p.y));
  return { track, series, pts };
}
function nearestFrameForPixelX(g, canvas, cssX) {
  const gs = graphSeries(g);
  if (!gs || !gs.pts.length) return null;
  const rect = canvas.getBoundingClientRect();
  const pad = 40;
  const xExtent = extent(gs.pts.map((p) => p.x));
  const xToPx = (x) => pad + (x - xExtent[0]) / (xExtent[1] - xExtent[0] || 1) * (rect.width - pad - 12);
  let best = gs.pts[0], bestD = Infinity;
  gs.pts.forEach((p) => { const d = Math.abs(xToPx(p.x) - cssX); if (d < bestD) { bestD = d; best = p; } });
  return best.frame;
}
function extent(arr) { return [Math.min(...arr), Math.max(...arr)]; }

// The two ROI bounds are set independently (drag sets both together, but
// the advanced numeric fields can set just one), so only sort them when
// both are actually numbers — a lone bound still means "from here to the
// end" / "from the start to here" as before. This is what makes dragging
// right-to-left behave the same as left-to-right.
function orderedRoi(g) {
  const hasMin = g.roiMin !== null, hasMax = g.roiMax !== null;
  let lo = hasMin ? g.roiMin : -Infinity;
  let hi = hasMax ? g.roiMax : Infinity;
  if (hasMin && hasMax && lo > hi) { const t = lo; lo = hi; hi = t; }
  return { lo, hi, hasRoi: hasMin || hasMax };
}

const GRAPH_TITLE_BAND_H = 26; // css px reserved at the top for opts.title (export only)
function drawGraph(g, canvas, opts) {
  opts = opts || {};
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.width / dpr, h = canvas.height / dpr;
  ctx.clearRect(0, 0, w, h);
  const gs = graphSeries(g);
  const statsEl = document.querySelector(`.graph-card[data-id="${g.id}"] .stats-readout`);
  if (opts.background) { ctx.fillStyle = opts.background; ctx.fillRect(0, 0, w, h); }
  const titleH = opts.title ? GRAPH_TITLE_BAND_H : 0;
  if (opts.title) {
    ctx.fillStyle = getCss('--text'); ctx.font = "600 13px 'IBM Plex Sans', sans-serif"; ctx.textAlign = 'left';
    ctx.fillText(opts.title, 12, 18);
  }
  if (!gs || gs.pts.length === 0) {
    ctx.fillStyle = getCss('--text-faint'); ctx.font = "12px 'IBM Plex Sans', sans-serif"; ctx.textAlign = 'left';
    ctx.fillText('No data points yet', 12, titleH + (h - titleH) / 2);
    if (statsEl) statsEl.textContent = '';
    const fr = document.querySelector(`.graph-card[data-id="${g.id}"] .fit-readout`);
    if (fr) fr.textContent = '';
    return;
  }
  const { track, pts } = gs;
  // Extra left/bottom room holds the axis titles (variable + units), drawn
  // below the tick numbers / to the left of them, always on — an export
  // additionally reserves titleH at the top for opts.title.
  const pad = { l: 58, r: 14, t: 12 + titleH, b: 42 };
  const xExtent = padExtent(extent(pts.map((p) => p.x)));
  const yExtent = padExtent(extent(pts.map((p) => p.y)));
  const X = (x) => pad.l + (x - xExtent[0]) / (xExtent[1] - xExtent[0] || 1) * (w - pad.l - pad.r);
  const Y = (y) => h - pad.b - (y - yExtent[0]) / (yExtent[1] - yExtent[0] || 1) * (h - pad.t - pad.b);

  // grid + axis ticks
  ctx.strokeStyle = getCss('--border'); ctx.fillStyle = getCss('--text-faint');
  ctx.font = "10.5px 'IBM Plex Mono', monospace"; ctx.lineWidth = 1;
  const nTicks = 4;
  ctx.textAlign = 'center';
  for (let i = 0; i <= nTicks; i++) {
    const xv = xExtent[0] + (i / nTicks) * (xExtent[1] - xExtent[0]);
    const px = X(xv);
    ctx.beginPath(); ctx.moveTo(px, pad.t); ctx.lineTo(px, h - pad.b); ctx.globalAlpha = 0.35; ctx.stroke(); ctx.globalAlpha = 1;
    ctx.fillText(compactNum(xv), px, h - pad.b + 14);
  }
  ctx.textAlign = 'right';
  for (let i = 0; i <= nTicks; i++) {
    const yv = yExtent[0] + (i / nTicks) * (yExtent[1] - yExtent[0]);
    const py = Y(yv);
    ctx.fillText(compactNum(yv), pad.l - 8, py + 3);
  }

  // axis titles — the tracked variable and its unit, e.g. "t (s)" / "y (m)"
  const xUnit = columnUnitSuffix(track, g.xKey), yUnit = columnUnitSuffix(track, g.yKey);
  const xLabel = eqSym(track, g.xKey) + (xUnit ? ` (${xUnit})` : '');
  const yLabel = eqSym(track, g.yKey) + (yUnit ? ` (${yUnit})` : '');
  ctx.fillStyle = getCss('--text-dim'); ctx.font = "600 11px 'IBM Plex Sans', sans-serif";
  ctx.textAlign = 'center';
  ctx.fillText(xLabel, pad.l + (w - pad.l - pad.r) / 2, h - 8);
  ctx.save();
  ctx.translate(14, pad.t + (h - pad.t - pad.b) / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.fillText(yLabel, 0, 0);
  ctx.restore();
  ctx.textAlign = 'left';

  // ROI shading
  const roi = orderedRoi(g);
  const roiMin = roi.lo, roiMax = roi.hi, hasRoi = roi.hasRoi;
  if (hasRoi) {
    const inRoiPts = pts.filter((p) => p.frame >= roiMin && p.frame <= roiMax);
    if (inRoiPts.length) {
      const xr = extent(inRoiPts.map((p) => p.x));
      ctx.fillStyle = getCss('--teal-tint'); ctx.globalAlpha = 0.6;
      ctx.fillRect(X(xr[0]), pad.t, X(xr[1]) - X(xr[0]), h - pad.t - pad.b);
      ctx.globalAlpha = 1;
    }
  }

  // points + connecting line (ordered by frame)
  const color = track.color;
  ctx.strokeStyle = color; ctx.globalAlpha = 0.5; ctx.lineWidth = 1.5;
  ctx.beginPath();
  pts.forEach((p, i) => { const px = X(p.x), py = Y(p.y); if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); });
  ctx.stroke(); ctx.globalAlpha = 1;
  pts.forEach((p) => {
    const inRoi = !hasRoi || (p.frame >= roiMin && p.frame <= roiMax);
    ctx.fillStyle = inRoi ? color : getCss('--text-faint');
    ctx.globalAlpha = inRoi ? 1 : 0.4;
    ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), 3, 0, 7); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // fit (optional, from "More options") — draws the curve, and when a fit
  // type is actually selected, also reports its equation on its own line
  // below the drag-selected average velocity/acceleration.
  const fitReadoutEl = document.querySelector(`.graph-card[data-id="${g.id}"] .fit-readout`);
  if (g.fit !== 'none') {
    const fitPts = pts.filter((p) => !hasRoi || (p.frame >= roiMin && p.frame <= roiMax));
    if (fitPts.length >= 2) {
      const xs = fitPts.map((p) => p.x), ys = fitPts.map((p) => p.y);
      let result = null, label = '';
      const symY = eqSym(track, g.yKey), symX = eqSym(track, g.xKey);
      try {
        if (g.fit === 'linear') { result = polyFit(xs, ys, 1); label = `${symY} = ${sig(result.coeffs[1])}${symX} + ${sig(result.coeffs[0])}`; }
        else if (g.fit === 'quadratic') { result = polyFit(xs, ys, 2); label = `${symY} = ${sig(result.coeffs[2])}${symX}² + ${sig(result.coeffs[1])}${symX} + ${sig(result.coeffs[0])}`; }
        else if (g.fit === 'cubic') { result = polyFit(xs, ys, 3); label = `${symY} = ${sig(result.coeffs[3])}${symX}³ + ${sig(result.coeffs[2])}${symX}² + ${sig(result.coeffs[1])}${symX} + ${sig(result.coeffs[0])}`; }
        else if (g.fit === 'sinusoidal') { result = sinFit(xs, ys, g.seedFreq); label = `${symY} = ${sig(result.A)}·sin(${sig(result.w)}${symX} + ${sig(result.phi)}) + ${sig(result.C)}   (f = ${sig(result.freqHz)})`; }
        else if (g.fit === 'auto') { result = bestPolyFit(xs, ys, 3); label = result ? `best fit (degree ${result.degree}): ` + polyLabel(result, symX, symY) : 'not enough points'; }
      } catch (e) { result = null; label = 'fit failed to converge'; }
      if (result) {
        ctx.strokeStyle = getCss('--amber'); ctx.lineWidth = 2; ctx.setLineDash([]);
        ctx.beginPath();
        const steps = 60;
        const [fx0, fx1] = extent(xs);
        for (let i = 0; i <= steps; i++) {
          const xv = fx0 + (i / steps) * (fx1 - fx0);
          const yv = result.predict(xv);
          const px = X(xv), py = Y(yv);
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
        if (fitReadoutEl) fitReadoutEl.textContent = 'Fit: ' + label + '   R² = ' + result.r2.toFixed(4);
      } else if (fitReadoutEl) { fitReadoutEl.textContent = 'Fit: ' + label; }
    } else if (fitReadoutEl) { fitReadoutEl.textContent = 'Pick a fit — need at least 2 points in range'; }
  } else if (fitReadoutEl) { fitReadoutEl.textContent = ''; }
  if (statsEl) statsEl.textContent = regionStatsText(g);
}

// Average velocity/acceleration for either the whole clip (no selection) or
// the currently dragged part of the graph — a straightforward secant-slope
// calculation over the raw track data, independent of whatever curve fit
// (if any) is drawn above. Reported component follows whatever's plotted:
// sideways (x/vx/ax), up/down (y/vy/ay), or overall speed/acceleration
// magnitude otherwise. Drag direction doesn't matter — orderedRoi() sorts
// the two bounds whenever both are set.
function regionStatsText(g) {
  const gs = graphSeries(g);
  if (!gs || !gs.pts.length) return 'No points marked yet.';
  const { series, track } = gs;
  const roi = orderedRoi(g);
  const hasSelection = roi.hasRoi && Number.isFinite(roi.lo) && Number.isFinite(roi.hi) && roi.lo !== roi.hi;
  let i0, i1;
  if (hasSelection) {
    const idxs = [];
    series.frames.forEach((f, i) => { if (f >= roi.lo && f <= roi.hi) idxs.push(i); });
    if (idxs.length < 2) return 'Drag across a bigger part of the graph — need at least 2 marked points.';
    i0 = idxs[0]; i1 = idxs[idxs.length - 1];
  } else {
    if (series.frames.length < 2) return 'Mark at least 2 points to see average velocity and acceleration.';
    i0 = 0; i1 = series.frames.length - 1;
  }
  const dt = series.t[i1] - series.t[i0];
  if (!(dt > 0)) return 'Mark points at different times to see average velocity and acceleration.';
  const uV = columnUnitSuffix(track, 'vx'), uA = columnUnitSuffix(track, 'ax');
  const key = g.yKey;
  let avgV, avgA, vLabel;
  if (key === 'y' || key === 'vy' || key === 'ay') {
    avgV = (series.y[i1] - series.y[i0]) / dt;
    avgA = (series.vy[i1] - series.vy[i0]) / dt;
    vLabel = 'Average velocity (up/down)';
  } else if (key === 'x' || key === 'vx' || key === 'ax') {
    avgV = (series.x[i1] - series.x[i0]) / dt;
    avgA = (series.vx[i1] - series.vx[i0]) / dt;
    vLabel = 'Average velocity (sideways)';
  } else {
    const avgVx = (series.x[i1] - series.x[i0]) / dt, avgVy = (series.y[i1] - series.y[i0]) / dt;
    const avgAx = (series.vx[i1] - series.vx[i0]) / dt, avgAy = (series.vy[i1] - series.vy[i0]) / dt;
    avgV = Math.hypot(avgVx, avgVy);
    avgA = Math.hypot(avgAx, avgAy);
    vLabel = 'Average speed (overall)';
  }
  const scope = hasSelection ? 'selected part' : 'whole clip';
  const hint = hasSelection ? '' : '  ·  drag across the graph to check just part of it';
  return `${vLabel} (${scope}): ${fmtStat(avgV)} ${uV}   ·   Average acceleration: ${fmtStat(avgA)} ${uA}${hint}`;
}
function fmtStat(v) { return Number.isFinite(v) ? v.toFixed(Math.abs(v) < 10 ? 3 : 2) : '—'; }
function polyLabel(r, symX, symY) {
  const terms = ['', symX || 'x', (symX || 'x') + '²', (symX || 'x') + '³'];
  return (symY || 'y') + ' = ' + r.coeffs.map((c, i) => sig(c) + terms[i]).reverse().join(' + ');
}
// Fit equations are printed with the actual plotted quantity's symbol (t,
// x, y, vx, θ, ...) rather than generic "x"/"y" — those are meaningless
// (and actively misleading) once the graph isn't literally y-vs-x, e.g. a
// y-vs-t plot mislabeled with generic "y = ...x²..." reads as if x were the
// independent variable, when it was actually time.
const EQ_SYMBOL = {
  point: { t: 't', x: 'x', y: 'y', vx: 'v_x', vy: 'v_y', ax: 'a_x', ay: 'a_y', speed: 'speed' },
};
function eqSym(track, key) { return (EQ_SYMBOL[track.kind] && EQ_SYMBOL[track.kind][key]) || key; }
function padExtent(ext) {
  const span = ext[1] - ext[0] || Math.abs(ext[0]) || 1;
  return [ext[0] - span * 0.08, ext[1] + span * 0.08];
}
function compactNum(v) { const av = Math.abs(v); if (av !== 0 && (av < 0.001 || av >= 100000)) return v.toExponential(1); return Number(v.toFixed(av < 10 ? 3 : 1)).toString(); }
function sig(v) { return Number(v.toPrecision(4)).toString(); }
function getCss(varName) { return getComputedStyle(document.documentElement).getPropertyValue(varName).trim() || '#888'; }

/* ======================================================================
   SECTION: PROJECT SAVE/LOAD + AUTOSAVE + SNAPSHOT
   ====================================================================== */
function refreshAll() { renderDataPanel(); renderGraphsPanel(); }

const AUTOSAVE_KEY = 'trackwright_autosave_v1';
let pendingAutosave = null;
let _autosaveTimer = null;
function autosaveSoon() {
  clearTimeout(_autosaveTimer);
  _autosaveTimer = setTimeout(() => {
    try { localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(serializeProject())); } catch (e) { /* storage may be unavailable — ignore */ }
  }, 500);
}
function loadPendingAutosave() {
  try {
    const raw = localStorage.getItem(AUTOSAVE_KEY);
    if (raw) pendingAutosave = JSON.parse(raw);
  } catch (e) { pendingAutosave = null; }
}
function maybeApplyAutosaveFor(videoName) {
  if (pendingAutosave && pendingAutosave.videoName && pendingAutosave.videoName === videoName) {
    applyProject(pendingAutosave, { keepVideoMeta: false });
    toast('Restored tracking data from your last session with this video.');
  }
}

function serializeProject() {
  return {
    version: 1, savedAt: new Date().toISOString(),
    fps: state.fps, videoName: state.videoName, videoDuration: state.videoDuration,
    autoAdvance: state.autoAdvance,
    calibration: state.calibration,
    tracks: state.tracks,
    graphs: state.graphs.map((g) => ({ ...g, picking: false })),
  };
}
function applyProject(proj, opts = {}) {
  if (!proj) return;
  state.calibration = proj.calibration || state.calibration;
  state.tracks = proj.tracks || [];
  state.graphs = proj.graphs || [];
  state.activeTrackId = state.tracks.length ? state.tracks[0].id : null;
  state.autoAdvance = proj.autoAdvance !== undefined ? proj.autoAdvance : state.autoAdvance;
  if (opts.keepVideoMeta === false && proj.fps) state.fps = proj.fps;
  renderCalibrationPanel(); renderTracksPanel(); renderDataPanel(); renderGraphsPanel(); redrawOverlay();
}

function saveProjectFile() {
  saveFile((sanitizeFilename(state.videoName || 'trackwright_project') || 'trackwright_project') + '.trackwright.json',
    JSON.stringify(serializeProject(), null, 2), 'application/json');
}
function loadProjectFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const proj = JSON.parse(reader.result);
      applyProject(proj, { keepVideoMeta: true });
      toast('Project loaded. Load the matching video to continue tracking.');
    } catch (e) { toast('That file could not be read as a Trackwright project.'); }
  };
  reader.readAsText(file);
}

async function snapshotFrame() {
  if (!state.videoLoaded) return;
  // Composite the current video frame with the live overlay canvas. Both
  // share the same full container box, but the video image itself only
  // occupies the letterboxed sub-rectangle described by displayRect — drawing
  // the <video> at the full canvas size would stretch it and desync it from
  // the overlay's tracked points, so it's drawn into that same sub-rect.
  const off = document.createElement('canvas');
  off.width = overlayCanvas.width; off.height = overlayCanvas.height;
  const octx2 = off.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const d = state.displayRect;
  octx2.fillStyle = getCss('--stage-bg') || '#000';
  octx2.fillRect(0, 0, off.width, off.height);
  octx2.drawImage(videoEl, d.offX * dpr, d.offY * dpr, d.dispW * dpr, d.dispH * dpr);
  octx2.drawImage(overlayCanvas, 0, 0);
  off.toBlob(async (blob) => {
    if (blob) await saveFile((sanitizeFilename(state.videoName || 'trackwright') || 'trackwright') + '_frame' + state.currentFrame + '.png', blob, 'image/png');
  }, 'image/png');
}

/* ======================================================================
   SECTION: MISC UI WIRING (tabs, theme, toast, mode buttons)
   ====================================================================== */
// ---- Popovers ----
// Opening a panel also sets the matching mode — the whole point of opening
// Ruler or Track is almost always to go tap the video, so that happens
// automatically instead of needing a second click. Numbers/Graph fall back
// to "select" mode (no tapping involved there), which also guards against
// an accidental mark landing on the video while reviewing.
const PANEL_DEFAULT_MODE = { calibration: 'calibrate', tracks: 'track', data: 'select', graphs: 'select' };
const PANEL_NAMES = ['calibration', 'tracks', 'data', 'graphs'];

function openPopover(name) {
  PANEL_NAMES.forEach((n) => $('popover-' + n).classList.toggle('open', n === name));
  $('popoverBackdrop').classList.add('show');
  setMode(PANEL_DEFAULT_MODE[name] || 'select');
}
// Closes whichever popover is open without touching the current mode — if
// Ruler or Track closed itself because you tapped its "tap the video now"
// button, the mode needs to survive the close so the video is immediately
// tappable. Explicit closes (the X button, tapping the backdrop) leave the
// mode as-is too; toggling the same edge button again is the one path that
// also resets to "select" (see the toolstrip handler below).
function closeAllPopovers() {
  PANEL_NAMES.forEach((n) => $('popover-' + n).classList.remove('open'));
  $('popoverBackdrop').classList.remove('show');
  syncEdgeButtons();
}
function syncEdgeButtons() {
  const openName = PANEL_NAMES.find((n) => $('popover-' + n).classList.contains('open')) || null;
  document.querySelectorAll('.edge-btn[data-panel]').forEach((b) => {
    const modeActive = (b.dataset.panel === 'calibration' && (state.mode === 'calibrate' || state.mode === 'axes'))
      || (b.dataset.panel === 'tracks' && state.mode === 'track');
    b.classList.toggle('accent', b.dataset.panel === openName || modeActive);
  });
  $('btnMeasureToggle').classList.toggle('accent', state.mode === 'tape');
}
document.querySelectorAll('.edge-btn[data-panel]').forEach((btn) => {
  btn.addEventListener('click', () => {
    const name = btn.dataset.panel;
    const wasOpen = $('popover-' + name).classList.contains('open');
    closeAllPopovers();
    if (wasOpen) { setMode('select'); } // toggling the same button off = "I'm done with this"
    else { openPopover(name); }
  });
});
document.querySelectorAll('.popover-close').forEach((btn) => btn.addEventListener('click', closeAllPopovers));
$('popoverBackdrop').addEventListener('click', closeAllPopovers);
$('btnMeasureToggle').addEventListener('click', () => {
  const wasActive = state.mode === 'tape';
  closeAllPopovers();
  setMode(wasActive ? 'select' : 'tape');
});

// ---- Theme ----
function applyStoredTheme() {
  let saved = null;
  try { saved = localStorage.getItem('trackwright_theme'); } catch (e) {}
  if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
  updateThemeIcon();
}
function updateThemeIcon() {
  const dark = isDark();
  $('themeIcon').innerHTML = dark
    ? '<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z" fill="currentColor" stroke="none"/>'
    : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
}
$('themeToggle').addEventListener('click', () => {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('trackwright_theme', next); } catch (e) {}
  updateThemeIcon();
  redrawOverlay(); renderGraphsPanel();
});

// ---- Video loading ----
$('btnLoadVideo').addEventListener('click', () => $('videoFileInput').click());
$('btnLoadVideo2').addEventListener('click', () => $('videoFileInput').click());
$('videoFileInput').addEventListener('change', (e) => { if (e.target.files[0]) handleVideoFile(e.target.files[0]); });
$('btnLoadSample').addEventListener('click', () => loadSampleVideo());

// ---- fps ----
$('fpsSelect').addEventListener('change', (e) => {
  $('fpsCustom').style.display = e.target.value === 'custom' ? 'inline-block' : 'none';
  state.fps = getFps();
  if (state.videoLoaded) { state.frameCount = Math.max(1, Math.round(state.videoDuration * state.fps)); $('scrub').max = String(state.frameCount - 1); updateTransportUI(); }
  refreshAll(); autosaveSoon();
});
$('fpsCustom').addEventListener('input', () => {
  state.fps = getFps();
  if (state.videoLoaded) { state.frameCount = Math.max(1, Math.round(state.videoDuration * state.fps)); $('scrub').max = String(state.frameCount - 1); updateTransportUI(); }
  refreshAll(); autosaveSoon();
});

// ---- Transport ----
$('btnFrameBack').addEventListener('click', () => stepFrame(-1));
$('btnFrameFwd').addEventListener('click', () => stepFrame(1));
$('btnPlay').addEventListener('click', () => togglePlay());
$('scrub').addEventListener('input', (e) => { seekToFrame(Number(e.target.value)).then(() => { updateTransportUI(); redrawOverlay(); }); });
$('speedSelect').addEventListener('change', (e) => { state.playbackSpeed = parseFloat(e.target.value); if (state.playing) videoEl.playbackRate = state.playbackSpeed; });

// ---- Snapshot / project ----
$('btnSnapshot').addEventListener('click', snapshotFrame);
$('btnSaveProject').addEventListener('click', saveProjectFile);
$('btnLoadProject').addEventListener('click', () => $('projectFileInput').click());
$('projectFileInput').addEventListener('change', (e) => { if (e.target.files[0]) loadProjectFile(e.target.files[0]); });

// ---- Graph "open larger" modal ----
$('graphModalClose').addEventListener('click', closeGraphModal);
$('graphModal').addEventListener('click', (e) => { if (e.target.id === 'graphModal') closeGraphModal(); });
$('graphModalSave').addEventListener('click', () => {
  const g = state.graphs.find((x) => x.id === expandedGraphId);
  if (g) exportGraphImage($('graphModalCanvas'), g);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && expandedGraphId) closeGraphModal(); });

// react to OS theme flips while the app is open with no manual override
if (window.matchMedia) {
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (!document.documentElement.getAttribute('data-theme')) { updateThemeIcon(); redrawOverlay(); renderGraphsPanel(); }
  });
}

/* ======================================================================
   SECTION: INIT
   ====================================================================== */
applyStoredTheme();
loadPendingAutosave();
renderCalibrationPanel();
renderTracksPanel();
renderDataPanel();
renderGraphsPanel();
setMode('select');
updateTransportUI();

checkSampleVideoAvailable().then((available) => {
  if (!available) return;
  $('sampleVideoRow').style.display = 'block';
  if (SAMPLE_VIDEO_AUTOLOAD && !state.videoLoaded) loadSampleVideo({ silent: true });
});

</script>
</body>
